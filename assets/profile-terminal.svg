<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">PerfectPan</title>
  <desc id="desc">A graphite-gray terminal. The command PerfectPan@github:~$ whoami returns PerfectPan.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.4s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="878" height="218" rx="16" fill="#161616" stroke="#333333"/>
  <path d="M1 47H879" stroke="#333333"/>
  <circle cx="25" cy="25" r="5" fill="#666666"/>
  <circle cx="43" cy="25" r="5" fill="#666666"/>
  <circle cx="61" cy="25" r="5" fill="#666666"/>
  <text x="440" y="30" text-anchor="middle" font-size="12" fill="#a3a3a3">PerfectPan / profile</text>
  <text xml:space="preserve" x="36" y="91" font-size="18"><tspan fill="#c7c7c7">PerfectPan@github</tspan><tspan fill="#a3a3a3">:~$ </tspan><tspan fill="#e5e5e5">whoami</tspan></text>
  <text x="34" y="151" font-size="48" font-weight="600" letter-spacing="-2" fill="#f2f2f2">PerfectPan</text>
  <rect class="cursor" x="320" y="118" width="3" height="36" rx="1" fill="#c7c7c7"/>
  <text x="36" y="187" font-size="14" fill="#a3a3a3">@PerfectPan</text>
</svg>
