<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">PerfectPan</title>
  <desc id="desc">A midnight-blue terminal. The command PerfectPan@github:~$ whoami returns PerfectPan.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111a30"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .cursor { animation: blink 1.4s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect x="1" y="1" width="878" height="218" rx="16" fill="url(#background)" stroke="#2a3550"/>
  <path d="M1 47H879" stroke="#2a3550"/>
  <circle cx="25" cy="25" r="5" fill="#f38ba8"/>
  <circle cx="43" cy="25" r="5" fill="#f9e2af"/>
  <circle cx="61" cy="25" r="5" fill="#a6e3a1"/>
  <text x="440" y="30" text-anchor="middle" font-size="12" fill="#a0aec8">PerfectPan / profile</text>
  <text xml:space="preserve" x="36" y="91" font-size="18"><tspan fill="#c4b5fd">PerfectPan@github</tspan><tspan fill="#a0aec8">:~$ </tspan><tspan fill="#e2e8f0">whoami</tspan></text>
  <text x="34" y="151" font-size="48" font-weight="600" letter-spacing="-2" fill="url(#accent)">PerfectPan</text>
  <rect class="cursor" x="320" y="118" width="15" height="36" rx="1" fill="#c4b5fd"/>
  <text x="36" y="187" font-size="14" fill="#a0aec8">@PerfectPan</text>
</svg>
